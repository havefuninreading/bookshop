<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>書籍內文介紹 | 書單分類目錄</title>
  <meta name="description" content="依分類整理的英文繪本、讀本與章節書內文介紹目錄。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg-page: #faf7f2;
  --bg-surface: #ffffff;
  --bg-subtle: #f3ede2;
  --bg-hover: #f7f2e9;
  --text-primary: #1f2421;
  --text-secondary: #5a625d;
  --text-muted: #878e88;
  --accent-primary: #b8522a;
  --accent-primary-hover: #963f1d;
  --accent-soft: #fbeee8;
  --accent-teal: #2b6758;
  --accent-teal-soft: #e6f2ee;
  --border-subtle: #e5dec9;
  --border-strong: #d2c8b0;
  --shadow-sm: 0 1px 3px rgba(31, 36, 33, 0.05), 0 1px 2px rgba(31, 36, 33, 0.03);
  --shadow-md: 0 6px 18px rgba(31, 36, 33, 0.07), 0 2px 6px rgba(31, 36, 33, 0.04);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --font-sans: "Noto Sans TC", "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-serif: "Newsreader", "Noto Serif TC", Georgia, serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: var(--font-sans);
  background-color: var(--bg-page);
  color: var(--text-primary);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* Controls Bar */
.controls-wrapper {
  position: sticky;
  top: 0;
  z-index: 20;
  background-color: rgba(250, 247, 242, 0.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border-subtle);
  padding: 0.9rem 1.5rem;
}

.controls-inner {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
}

.search-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.85rem;
}

.search-box {
  position: relative;
  flex: 1 1 280px;
  max-width: 460px;
}

.search-icon {
  position: absolute;
  left: 0.85rem;
  top: 50%;
  transform: translateY(-50%);
  width: 17px;
  height: 17px;
  color: var(--text-muted);
  pointer-events: none;
}

.search-input {
  width: 100%;
  padding: 0.6rem 2.2rem 0.6rem 2.5rem;
  font-size: 0.92rem;
  font-family: inherit;
  color: var(--text-primary);
  background-color: var(--bg-surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.search-input:focus {
  border-color: var(--accent-primary);
  box-shadow: 0 0 0 3px rgba(184, 82, 42, 0.14);
}

.clear-search-btn {
  position: absolute;
  right: 0.55rem;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  padding: 0.2rem;
  display: none;
  line-height: 1;
  font-size: 1.1rem;
}

.clear-search-btn.visible {
  display: block;
}

.filter-meta-group {
  display: flex;
  align-items: center;
  gap: 1.1rem;
  flex-wrap: wrap;
}

.toggle-label {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.88rem;
  color: var(--text-secondary);
  cursor: pointer;
  user-select: none;
}

.toggle-checkbox {
  width: 16px;
  height: 16px;
  accent-color: var(--accent-primary);
  cursor: pointer;
}

.stats-summary {
  font-size: 0.85rem;
  color: var(--text-secondary);
  background-color: var(--bg-subtle);
  padding: 0.3rem 0.7rem;
  border-radius: 999px;
}

/* Category Tabs */
.category-nav {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.category-nav-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem;
}

.category-tab {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.42rem 0.85rem;
  font-size: 0.86rem;
  font-weight: 500;
  font-family: inherit;
  white-space: nowrap;
  border-radius: 999px;
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-surface);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s ease;
}

.category-tab:hover {
  border-color: var(--border-strong);
  color: var(--text-primary);
  background-color: var(--bg-hover);
}

.category-tab.active {
  background-color: var(--text-primary);
  border-color: var(--text-primary);
  color: var(--bg-surface);
}

.category-tab .tab-count {
  font-size: 0.75rem;
  padding: 0.05rem 0.42rem;
  border-radius: 999px;
  background-color: var(--bg-subtle);
  color: var(--text-secondary);
}

.category-tab.active .tab-count {
  background-color: rgba(255, 255, 255, 0.2);
  color: #ffffff;
}

/* Main Content */
.main-container {
  max-width: 1120px;
  margin: 0 auto;
  padding: 2rem 1.5rem 4rem;
}

.categories-list {
  display: flex;
  flex-direction: column;
  gap: 2.25rem;
}

.category-section {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}

.category-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.5rem;
  padding: 1.15rem 1.5rem;
  background-color: var(--bg-subtle);
  border-bottom: 1px solid var(--border-subtle);
}

.category-title {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.category-marker {
  display: inline-block;
  width: 6px;
  height: 18px;
  border-radius: 3px;
  background-color: var(--accent-primary);
}

.category-meta {
  font-size: 0.82rem;
  color: var(--text-secondary);
}

.book-list {
  list-style: none;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1px;
  background-color: var(--border-subtle);
}

.book-item {
  background-color: var(--bg-surface);
  display: flex;
}

.book-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.95rem;
  width: 100%;
  padding: 0.85rem 1.25rem;
  text-decoration: none;
  color: inherit;
  transition: background-color 0.15s ease;
}

.book-cover-wrap {
  width: 60px;
  height: 76px;
  flex-shrink: 0;
  border-radius: 6px;
  background-color: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  box-shadow: 0 2px 6px rgba(31, 36, 33, 0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

.book-cover-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  background-color: #ffffff;
  transition: transform 0.2s ease;
}

.book-card.has-link:hover .book-cover-img {
  transform: scale(1.04);
}

.book-cover-placeholder {
  width: 22px;
  height: 22px;
  color: var(--text-muted);
  opacity: 0.55;
}

.book-card.has-link:hover {
  background-color: var(--bg-hover);
}

.book-card.has-link:hover .book-title {
  color: var(--accent-primary);
}

.link-badge:hover,
.link-badge:focus-visible {
  background-color: var(--accent-primary);
  color: #ffffff;
}

.book-info {
  min-width: 0;
  flex: 1;
}

.book-title {
  font-family: var(--font-serif);
  font-size: 1.03rem;
  font-weight: 500;
  color: var(--text-primary);
  line-height: 1.4;
  word-break: break-word;
  transition: color 0.15s ease;
}

.link-badge-group {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 0.4rem;
  flex-shrink: 0;
}

.link-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.3rem;
  flex-shrink: 0;
  padding: 0.32rem 0.68rem;
  font-size: 0.78rem;
  font-weight: 600;
  text-decoration: none;
  border-radius: var(--radius-sm);
  background-color: var(--accent-soft);
  color: var(--accent-primary);
  transition: background-color 0.15s ease, color 0.15s ease;
}

/* Status & Empty States */
.status-box {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 3rem 1.5rem;
  text-align: center;
  box-shadow: var(--shadow-sm);
}

.status-title {
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 0.4rem;
}

.status-desc {
  font-size: 0.9rem;
  color: var(--text-secondary);
}

.spinner {
  width: 32px;
  height: 32px;
  border: 3px solid var(--border-subtle);
  border-top-color: var(--accent-primary);
  border-radius: 50%;
  margin: 0 auto 1rem;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.error-box {
  border-color: #e4b4a6;
  background-color: #fff8f6;
}

@media (max-width: 640px) {
  .controls-wrapper {
    padding: 0.75rem 1rem;
  }

  .main-container {
    padding: 1.25rem 1rem 3rem;
  }

  .category-header {
    padding: 0.95rem 1.1rem;
  }

  .book-list {
    grid-template-columns: 1fr;
  }

  .book-card {
    padding: 0.85rem 1.1rem;
  }
}
  </style>
</head>
<body>
  <div class="controls-wrapper">
    <div class="controls-inner">
      <div class="search-row">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input id="search-input" class="search-input" type="search" placeholder="搜尋書名或分類..." autocomplete="off">
          <button id="clear-search-btn" class="clear-search-btn" type="button" aria-label="清除搜尋">&times;</button>
        </div>

        <div class="filter-meta-group">
          <label class="toggle-label" for="only-links-checkbox">
            <input id="only-links-checkbox" class="toggle-checkbox" type="checkbox">
            僅顯示有影片或文字介紹的書籍
          </label>
          <span id="stats-summary" class="stats-summary" aria-live="polite">讀取中...</span>
        </div>
      </div>

      <nav id="category-nav" class="category-nav" aria-label="書籍分類篩選"></nav>
    </div>
  </div>

  <main class="main-container">
    <div id="content-area">
      <div class="status-box" role="status">
        <div class="spinner" aria-hidden="true"></div>
        <p class="status-title">正在讀取書單資料...</p>
        <p class="status-desc">正從線上書單同步最新分類與書籍連結</p>
      </div>
    </div>
  </main>

  <script>

const SPREADSHEET_ID = '12zw_Tm9rmINLc6dT9lll9TvsJXzu95TxymGQz9bRYUw';
const SHEET_NAME = 'SALE-LIST';
const CATEGORY_NAV_ROWS = 2;

const dynamicCoverCache = new Map();

const state = {
  categories: [],
  activeCategory: 'ALL',
  searchQuery: '',
  onlyWithLinks: false,
};

let elements = {};

function buildGvizUrl(tqxParam) {
  const base = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq`;
  const params = new URLSearchParams({
    tqx: tqxParam,
    sheet: SHEET_NAME,
  });
  return `${base}?${params.toString()}`;
}

function parseGvizResponseText(rawText) {
  const startIdx = rawText.indexOf('{');
  const endIdx = rawText.lastIndexOf('}');
  if (startIdx === -1 || endIdx === -1 || endIdx <= startIdx) {
    throw new Error('無法解析 Google Sheet 回傳的資料格式。');
  }
  return JSON.parse(rawText.slice(startIdx, endIdx + 1));
}

function fetchViaJsonp() {
  return new Promise((resolve, reject) => {
    const callbackName = `gvizCallback_${Date.now()}_${Math.floor(Math.random() * 10000)}`;
    const script = document.createElement('script');
    const timeoutId = window.setTimeout(() => {
      cleanup();
      reject(new Error('讀取 Google Sheet 逾時，請檢查網路連線或試算表權限。'));
    }, 12000);

    function cleanup() {
      window.clearTimeout(timeoutId);
      delete window[callbackName];
      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }
    }

    window[callbackName] = (data) => {
      cleanup();
      resolve(data);
    };

    script.src = buildGvizUrl(`responseHandler:${callbackName}`);
    script.onerror = () => {
      cleanup();
      reject(new Error('無法載入 Google Sheet 資料，請確認試算表已開啟檢視權限。'));
    };

    document.head.appendChild(script);
  });
}

async function fetchSheetData() {
  if (window.location.protocol === 'file:') {
    return fetchViaJsonp();
  }

  try {
    const response = await fetch(buildGvizUrl('out:json'), { cache: 'no-store' });
    if (!response.ok) {
      throw new Error(`HTTP 錯誤 (${response.status})`);
    }
    const text = await response.text();
    return parseGvizResponseText(text);
  } catch {
    return fetchViaJsonp();
  }
}

function getCellValue(row, colIndex) {
  const cell = row?.c?.[colIndex];
  if (!cell || cell.v === null || cell.v === undefined) {
    return '';
  }
  return String(cell.v).trim();
}

function normalizeUrl(rawUrl) {
  if (!rawUrl) return '';
  try {
    const parsed = new URL(rawUrl);
    if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
      return parsed.href;
    }
    return '';
  } catch {
    return '';
  }
}

function cleanQueryTitle(title) {
  return title
    .replace(/\bICR\s*:?\s*/gi, 'I Can Read ')
    .replace(/\/\s*My First\b/gi, ' My First')
    .replace(/\/\s*HC\b/gi, '')
    .replace(/#0?(\d+)/g, ' $1 ')
    .replace(/[:/]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

async function fetchFallbackCover(title) {
  const lower = title.toLowerCase();
  if (dynamicCoverCache.has(lower)) {
    return dynamicCoverCache.get(lower);
  }
  dynamicCoverCache.set(lower, null);

  try {
    const q = encodeURIComponent(cleanQueryTitle(title));
    const res = await fetch(`https://openlibrary.org/search.json?limit=1&q=${q}`);
    if (!res.ok) return null;
    const data = await res.json();
    const coverId = data?.docs?.[0]?.cover_i;
    if (coverId) {
      const url = `https://covers.openlibrary.org/b/id/${coverId}-M.jpg`;
      dynamicCoverCache.set(lower, url);
      return url;
    }
  } catch {
    // Ignore fallback lookup errors silently
  }
  return null;
}

function parseRowsToCategories(gvizData) {
  if (gvizData?.status === 'error') {
    const message = gvizData.errors?.[0]?.detailed_message || 'Google Sheet 回傳錯誤';
    throw new Error(message);
  }

  const rows = gvizData?.table?.rows || [];
  const categoryMap = new Map();
  const categories = [];
  let currentCategoryName = '未分類';

  rows.forEach((row, index) => {
    const colA = getCellValue(row, 0);
    const colB = getCellValue(row, 1);
    const colC = getCellValue(row, 2);
    const colD = getCellValue(row, 3);
    const colE = getCellValue(row, 4);

    if (index === 0 && (colA === '類別' || colB === '書名')) {
      return;
    }

    if (!colA && !colB) {
      return;
    }

    if (colA) {
      currentCategoryName = colA;
    }

    if (!categoryMap.has(currentCategoryName)) {
      const catObj = {
        name: currentCategoryName,
        books: [],
      };
      categoryMap.set(currentCategoryName, catObj);
      categories.push(catObj);
    }

    if (colB) {
      const sheetCover = normalizeUrl(colE);
      const cachedCover = dynamicCoverCache.get(colB.toLowerCase()) || '';
      categoryMap.get(currentCategoryName).books.push({
        title: colB,
        textUrl: normalizeUrl(colC),
        videoUrl: normalizeUrl(colD),
        coverUrl: sheetCover || cachedCover,
      });
    }
  });

  return categories;
}

function hasAnyLink(book) {
  return Boolean(book.textUrl || book.videoUrl);
}

function filterBooks(cat) {
  const query = state.searchQuery.trim().toLowerCase();
  const categoryMatchesQuery = query && cat.name.toLowerCase().includes(query);
  return cat.books.filter((book) => {
    if (state.onlyWithLinks && !hasAnyLink(book)) return false;
    if (!query || categoryMatchesQuery) return true;
    return book.title.toLowerCase().includes(query);
  });
}

function getFilteredCategories() {
  return state.categories
    .filter((cat) => state.activeCategory === 'ALL' || cat.name === state.activeCategory)
    .map((cat) => ({ name: cat.name, books: filterBooks(cat) }))
    .filter((cat) => cat.books.length > 0);
}

function renderCategoryNav() {
  const nav = elements.categoryNav;
  nav.textContent = '';

  const countBookMatch = (cat) => filterBooks(cat).length;

  const totalCount = state.categories.reduce((sum, cat) => sum + countBookMatch(cat), 0);
  const tabs = [createCategoryTab('ALL', '全部類別', totalCount)];

  state.categories.forEach((cat) => {
    const count = countBookMatch(cat);
    tabs.push(createCategoryTab(cat.name, cat.name, count));
  });

  let startIndex = 0;
  for (let i = 0; i < CATEGORY_NAV_ROWS; i++) {
    const size =
      Math.floor(tabs.length / CATEGORY_NAV_ROWS) +
      (i < tabs.length % CATEGORY_NAV_ROWS ? 1 : 0);
    const rowItems = tabs.slice(startIndex, startIndex + size);
    startIndex += size;

    if (rowItems.length === 0) continue;

    const rowDiv = document.createElement('div');
    rowDiv.className = 'category-nav-row';
    rowItems.forEach((tab) => rowDiv.appendChild(tab));
    nav.appendChild(rowDiv);
  }
}

function createCategoryTab(value, label, count) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = `category-tab${state.activeCategory === value ? ' active' : ''}`;
  btn.addEventListener('click', () => {
    state.activeCategory = value;
    renderCategoryNav();
    renderBooks();
  });

  const textSpan = document.createElement('span');
  textSpan.textContent = label;

  const countSpan = document.createElement('span');
  countSpan.className = 'tab-count';
  countSpan.textContent = String(count);

  btn.appendChild(textSpan);
  btn.appendChild(countSpan);
  return btn;
}

function renderBooks() {
  const filteredCategories = getFilteredCategories();
  const totalBooksShown = filteredCategories.reduce((sum, cat) => sum + cat.books.length, 0);
  const totalWithLinksShown = filteredCategories.reduce(
    (sum, cat) => sum + cat.books.filter(hasAnyLink).length,
    0
  );

  elements.statsSummary.textContent = `共 ${filteredCategories.length} 個分類・${totalBooksShown} 本書（${totalWithLinksShown} 本含介紹連結）`;

  const container = elements.contentArea;
  container.textContent = '';

  if (filteredCategories.length === 0) {
    const emptyBox = document.createElement('div');
    emptyBox.className = 'status-box';

    const title = document.createElement('p');
    title.className = 'status-title';
    title.textContent = '找不到符合條件的書籍';

    const desc = document.createElement('p');
    desc.className = 'status-desc';
    desc.textContent = '請嘗試清除搜尋關鍵字或切換其他分類。';

    emptyBox.appendChild(title);
    emptyBox.appendChild(desc);
    container.appendChild(emptyBox);
    return;
  }

  const listWrapper = document.createElement('div');
  listWrapper.className = 'categories-list';

  filteredCategories.forEach((cat) => {
    const section = document.createElement('section');
    section.className = 'category-section';

    const header = document.createElement('div');
    header.className = 'category-header';

    const titleEl = document.createElement('h2');
    titleEl.className = 'category-title';

    const marker = document.createElement('span');
    marker.className = 'category-marker';
    marker.setAttribute('aria-hidden', 'true');

    const titleText = document.createElement('span');
    titleText.textContent = cat.name;

    titleEl.appendChild(marker);
    titleEl.appendChild(titleText);

    const linkedCount = cat.books.filter(hasAnyLink).length;
    const metaEl = document.createElement('span');
    metaEl.className = 'category-meta';
    metaEl.textContent = `${cat.books.length} 本書・${linkedCount} 篇介紹`;

    header.appendChild(titleEl);
    header.appendChild(metaEl);

    const ul = document.createElement('ul');
    ul.className = 'book-list';

    cat.books.forEach((book) => {
      const li = document.createElement('li');
      li.className = 'book-item';
      li.appendChild(createBookCard(book));
      ul.appendChild(li);
    });

    section.appendChild(header);
    section.appendChild(ul);
    listWrapper.appendChild(section);
  });

  container.appendChild(listWrapper);
}

function createPlaceholderIcon() {
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('class', 'book-cover-placeholder');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.8');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.setAttribute('aria-hidden', 'true');

  const path1 = document.createElementNS(svgNS, 'path');
  path1.setAttribute('d', 'M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20');
  svg.appendChild(path1);
  return svg;
}

function attachCoverImage(coverWrap, url, title) {
  const img = document.createElement('img');
  img.className = 'book-cover-img';
  img.src = url;
  img.alt = `${title} 封面`;
  img.loading = 'lazy';
  img.decoding = 'async';
  img.referrerPolicy = 'no-referrer';

  img.onerror = () => {
    coverWrap.textContent = '';
    coverWrap.appendChild(createPlaceholderIcon());
  };

  coverWrap.textContent = '';
  coverWrap.appendChild(img);
}

function createLinkBadge(label, url) {
  const badge = document.createElement('a');
  badge.className = 'link-badge';
  badge.href = url;
  badge.target = '_blank';
  badge.rel = 'noopener noreferrer';
  badge.textContent = `${label} ↗`;
  return badge;
}

function createBookCard(book) {
  const card = document.createElement('div');
  card.className = `book-card${hasAnyLink(book) ? ' has-link' : ''}`;

  const coverWrap = document.createElement('div');
  coverWrap.className = 'book-cover-wrap';

  if (book.coverUrl) {
    attachCoverImage(coverWrap, book.coverUrl, book.title);
  } else {
    coverWrap.appendChild(createPlaceholderIcon());
    fetchFallbackCover(book.title).then((foundUrl) => {
      if (foundUrl) {
        book.coverUrl = foundUrl;
        attachCoverImage(coverWrap, foundUrl, book.title);
      }
    });
  }

  card.appendChild(coverWrap);

  const infoDiv = document.createElement('div');
  infoDiv.className = 'book-info';

  const titleP = document.createElement('p');
  titleP.className = 'book-title';
  titleP.textContent = book.title;
  infoDiv.appendChild(titleP);

  card.appendChild(infoDiv);

  if (hasAnyLink(book)) {
    const badgeGroup = document.createElement('div');
    badgeGroup.className = 'link-badge-group';
    if (book.videoUrl) {
      badgeGroup.appendChild(createLinkBadge('影片介紹', book.videoUrl));
    }
    if (book.textUrl) {
      badgeGroup.appendChild(createLinkBadge('文字介紹', book.textUrl));
    }
    card.appendChild(badgeGroup);
  }

  return card;
}

function renderError(message) {
  elements.statsSummary.textContent = '讀取失敗';
  const box = document.createElement('div');
  box.className = 'status-box error-box';

  const title = document.createElement('p');
  title.className = 'status-title';
  title.textContent = '無法讀取 Google Sheet 資料';

  const desc = document.createElement('p');
  desc.className = 'status-desc';
  desc.textContent = message;

  box.appendChild(title);
  box.appendChild(desc);

  elements.contentArea.textContent = '';
  elements.contentArea.appendChild(box);
}

async function init() {
  try {
    const rawData = await fetchSheetData();
    state.categories = parseRowsToCategories(rawData);
    renderCategoryNav();
    renderBooks();
  } catch (err) {
    renderError(err instanceof Error ? err.message : '發生未知錯誤，請稍後再試。');
  }
}

function bootstrap() {
  elements = {
    contentArea: document.getElementById('content-area'),
    categoryNav: document.getElementById('category-nav'),
    searchInput: document.getElementById('search-input'),
    clearSearchBtn: document.getElementById('clear-search-btn'),
    onlyLinksCheckbox: document.getElementById('only-links-checkbox'),
    statsSummary: document.getElementById('stats-summary'),
  };

  elements.searchInput.addEventListener('input', (event) => {
    state.searchQuery = event.target.value;
    elements.clearSearchBtn.classList.toggle('visible', state.searchQuery.length > 0);
    renderCategoryNav();
    renderBooks();
  });

  elements.clearSearchBtn.addEventListener('click', () => {
    state.searchQuery = '';
    elements.searchInput.value = '';
    elements.clearSearchBtn.classList.remove('visible');
    elements.searchInput.focus();
    renderCategoryNav();
    renderBooks();
  });

  elements.onlyLinksCheckbox.addEventListener('change', (event) => {
    state.onlyWithLinks = event.target.checked;
    renderCategoryNav();
    renderBooks();
  });

  init();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootstrap);
} else {
  bootstrap();
}
  </script>
</body>
</html>
